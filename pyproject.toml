[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim"
version = "0.1.0"
description = "Generative Social Simulation — MVP"
readme = "generative-social-simulation-technical-spec.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2.3",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "numpy>=2.1.0",
  "networkx>=3.4",
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
sim-engine = "sim.workers.engine:main"
sim-model-worker = "sim.workers.model_worker:main"
sim-api = "sim.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
